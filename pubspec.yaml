name: dev_search
description: "dev_search is a package that allows you to search for developers by their username on GitHub."


version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.6
  dartz: ^0.10.1
  flutter_modular: ^5.0.3
  dio: ^5.7.0
  url_launcher: ^6.3.1
  lottie: ^3.1.3
  equatable: ^2.0.7
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
  - asset/images/
